openapi: 3.0.4
info:
  title: MIME Type Lookup
  description: >-
    MIME Type Lookup matches file extensions to MIME types, categories, and
    default character encodings, or returns matching extensions for any media
    type. Paid plans add gzip compressibility flags, the registry that defines
    each type (IANA, Apache or nginx), and every extension sharing that type.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/mimetypelookup:
    get:
      summary: MIME Type Lookup
      description: >-
        Look up the MIME type by file extension, with its defining source and
        every extension sharing it on paid plans
      operationId: mimetypelookup
      parameters:
        - name: extension
          in: query
          schema:
            type: string
          required: true
          description: File extension to lookup (without the leading dot)
          example: pdf
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  count: 1
                  results:
                    - extension: jpg
                      mimeType: image/jpeg
                      category: image
                      charset: null
                      compressible: false
                      source: iana
                      extensions:
                        - jpg
                        - jpeg
                        - jpe
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
